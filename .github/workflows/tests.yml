name: Tests

# Quoted: unquoted `on` parses as boolean True under YAML 1.1.
"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push on the same PR replaces the stale run instead of queuing behind it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Create virtualenv and install LEO with dev dependencies
        run: |
          uv venv --python 3.12
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Run tests
        run: .venv/bin/python -m pytest -q
