# LEO live model configuration.
# No secret values are stored here: only the NAME of the env var holding the key.
#
# OpenCode Go catalog, synced 2026-11-21 from
#   GET https://opencode.ai/inference/go/anthropic/v1/models
# `opencode-go` is the gateway entry and runs DeepSeek V4.1 Flash by default.
# Every other model is a provider named by its exact id. Re-sync when OpenCode
# adds or removes models; switch models by editing models.default to a key below.
models:
  default: opencode-go
  # Keep the fallback on the same provider: no silent cross-model switching.
  fallback: opencode-go
  # No silent mock answers.
  allow_mock_fallback: false
  # 0 = one attempt only. Raise to opt into cross-model escalation.
  escalation_limit: 0
  providers:
    opencode-go: &opencode
      kind: anthropic-compatible
      base_url: https://opencode.ai/inference/go/anthropic
      api_key_env: ANTHROPIC_AUTH_TOKEN
      model: deepseek-v4.1-flash
      # Capability metadata is shared; adjust per model if a provider rejects a case.
      capabilities: [text, streaming, tools, structured, usage, vision]
      context_window: 128000
      # OpenCode Go requires a stable session ID per LEO instance.
      extra_header_env:
        x-opencode-session: LEO_OPENCODE_SESSION
      # Gateway rejects generic library user agents (Cloudflare 1010).
      extra_headers:
        User-Agent: leo-agent-os/0.1.0
    deepseek-v4-pro:
      <<: *opencode
      model: deepseek-v4-pro
    glm-5.3:
      <<: *opencode
      model: glm-5.3
    grok-4.7:
      <<: *opencode
      model: grok-4.7
    muse-spark-1.2-contributor:
      <<: *opencode
      model: muse-spark-1.2-contributor
    muse-spark-1.3-contributor:
      <<: *opencode
      model: muse-spark-1.3-contributor
    glm-5.3-flash:
      <<: *opencode
      model: glm-5.3-flash
    gpt-5.6-luna:
      <<: *opencode
      model: gpt-5.6-luna
    gpt-6-luna:
      <<: *opencode
      model: gpt-6-luna
    claude-haiku-5-5:
      <<: *opencode
      model: claude-haiku-5-5
    hy3:
      <<: *opencode
      model: hy3
    hy4-preview:
      <<: *opencode
      model: hy4-preview
    kimi-k2.7-code:
      <<: *opencode
      model: kimi-k2.7-code
    kimi-k3:
      <<: *opencode
      model: kimi-k3
    mimo-v2.6-flash:
      <<: *opencode
      model: mimo-v2.6-flash
    mimo-v2.6-pro:
      <<: *opencode
      model: mimo-v2.6-pro
    minimax-m3:
      <<: *opencode
      model: minimax-m3
    minimax-m3.1-flash:
      <<: *opencode
      model: minimax-m3.1-flash
    longcat-2.0:
      <<: *opencode
      model: longcat-2.0
    step-5-preview:
      <<: *opencode
      model: step-5-preview
    beam-free:
      <<: *opencode
      model: beam-free
    qwen3.8-max:
      <<: *opencode
      model: qwen3.8-max
    qwen3.8-flash:
      <<: *opencode
      model: qwen3.8-flash
    qwen3.7-plus:
      <<: *opencode
      model: qwen3.7-plus
    kimi-k3.1-pro:
      <<: *opencode
      model: kimi-k3.1-pro
    iceman-contributor-free:
      <<: *opencode
      model: iceman-contributor-free
    gemini-4-argon:
      <<: *opencode
      model: gemini-4-argon
    hy4:
      <<: *opencode
      model: hy4
    longcat-2.5-free:
      <<: *opencode
      model: longcat-2.5-free
    hy4-flash-free:
      <<: *opencode
      model: hy4-flash-free
    qwen4-max:
      <<: *opencode
      model: qwen4-max
security:
  allowed_roots:
    # `~` is expanded per operator (see Settings.resolve), so this file stays
    # portable; add absolute roots only in a local, uncommitted override.
    - ~/Downloads
