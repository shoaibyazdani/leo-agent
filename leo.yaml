paths:
  # Whitelist root for outbound attachments (channel_send / message send media).
  # Config-owned on purpose: it is read once at startup and given to the Gateway
  # at construction, so no tool-call argument can widen it. Relative paths are
  # resolved against the config root. Files outside this tree are refused.
  outbound_media: .leo/media/outbound

learning:
  # Autonomous memory notes. The engine reads LEO's own durable history and
  # writes safe notes without asking; secrets, instruction-shaped text and
  # external/tool-injected content are still dropped before a note exists, and
  # every note keeps evidence hashes. Set enabled: false to restore a
  # HIGH-risk approval for every note.
  auto_notes:
    enabled: true
    # Only these source kinds may be written unattended. `external` is
    # rejected by the policy, so web/injected text cannot become a note.
    trusted_sources: [user, tool, run]
    # Personal/project/organizational facts are included because they are what
    # an assistant is normally expected to remember. Remove them to keep those
    # approval-bound.
    allowed_categories: [working, episodic, semantic, procedural, personal, project, organizational]
    max_confidence: 0.8
    allow_high_risk_categories: true
    allow_unattended_writes: true
    # Never promote unattended chat text to a FACT; notes stay UNVERIFIED.
    promote_facts: false

  # Post-turn skill review. After a few completed turns LEO replays a bounded
  # transcript through a small tool scope and may patch or author a
  # documentation-only skill (or propose a memory note). Authored skills never
  # execute; every write is validated, read-before-write gated and audited.
  review:
    enabled: true
    interval_turns: 5
    max_tool_rounds: 12
    max_input_tokens: 48000
    timeout_seconds: 120
    min_transcript_chars: 200
    model: ""                 # empty = the configured default chat model
    capture_memory: true
    # Background skill writes apply directly and are announced. Set true to
    # stage them for /skills approve instead. Interactive writes are unaffected.
    write_approval: false
    # /learn gathers sources with read-only file tools and http_get, then
    # authors directly because the user asked for the skill.
    learn_enabled: true
    learn_max_tool_rounds: 24
    learn_max_input_tokens: 96000
    learn_allow_network: true
    max_messages: 80
    max_transcript_chars: 60000
    tool_preview_chars: 500

  # Self-improvement from LEO's own work. Recurring tool patterns become
  # documentation-only skills and nightly failure reviews write durable notes.
  # Neither path raises an approval card; both are validated first and never
  # touch safety rules, secrets, hardline permissions or model/provider config.
  self_improvement:
    enabled: true
    nightly_cron: "0 3 * * *"   # UTC, on the durable scheduler
    min_recurrences: 3          # matching turns/tasks before a skill is saved
    max_corrections: 3          # corrections before a learned skill is retired

skills:
  # Deterministic lifecycle for agent-authored skills. Stale/archive are
  # reversible state transitions; content is never rewritten or deleted.
  curator:
    enabled: true
    interval_hours: 168          # one pass per week
    min_idle_hours: 2            # only while the profile is quiet
    stale_after_days: 14
    archive_after_days: 30
    # Opt-in LLM consolidation: it only stages a multi-operation plan for
    # /skills approve; native skills never enter a group and nothing is
    # rewritten automatically.
    consolidate: false
    max_groups: 3
    model: ""                    # empty = the configured default chat model

security:
  # Hold a chat turn while a HIGH-risk approval is pending. The same tool call
  # resumes automatically when the operator taps Approve/Always; deny, expiry
  # or the 15-minute approval timeout returns a denial to the model instead of
  # ending the turn and forgetting the decision.
  wait_for_approval: true
  approval_poll_seconds: 2
  # smart: normal workspace shell runs under a workspace trust; the rest asks
  # with once / this-command / trust-workspace options. manual: always ask.
  # off: no ordinary prompts (hardline, deny globs and path rules still apply).
  approval_mode: smart
  # "Trust workspace" button lifetime; the reference tools use until-revoked.
  workspace_trust_days: 30
  # In smart mode, a cheap model reviews an otherwise-uncovered HIGH shell call
  # before a human is asked. Destructive/credential/arbitrary-code calls skip it.
  reviewer_enabled: true
  reviewer_model: ""          # empty = the configured default chat model
  reviewer_timeout_seconds: 20
  # Smart shell policy. smart auto-runs read-only/test commands, asks
  # for risky or unknown ones, and always denies the hardline blocklist.
  # manual asks for every command; off runs everything except hardline.
  shell_enabled: true
  shell_mode: smart
  # Glob patterns that always deny, before approvals are consulted. Example:
  # deny_commands:
  #   - "git push --force*"
  deny_commands: []
  allowed_roots:
    # `~` is expanded per operator (see Settings.resolve), so this file stays
    # portable; add absolute roots only in a local, uncommitted override.
    - ~/Downloads

automation:
  # Scheduler cadence and the durable background-task concurrency gate.
  tick_seconds: 1.0
  max_concurrent_tasks: 4
  default_task_timeout_seconds: 3600
  # Conditional proactive scheduling guidance. off removes the hint only;
  # offer is the shipped default; create is opt-in and never bypasses cards.
  proactive_mode: offer
  # Scheduled script execution is operator-provisioned and opt-in. Scripts run
  # without a shell, with a minimal environment, from `scripts_root`, under a
  # timeout and output cap. A relative `script` resolves here; an absolute path
  # must stay inside it.
  allow_scripts: false
  scripts_root: ~/LEO/scripts/scheduled
  script_timeout_seconds: 60
  script_max_output_bytes: 200000
  # URL monitors use the same egress-checked HTTP client; script monitors use
  # the restricted runner above.
  monitor_timeout_seconds: 20
  monitor_max_bytes: 200000
  # Unified delivery context. `home` and `all` resolve only to configured
  # platform:chat[:thread] homes. Named bot-chat profiles and local:<id>
  # conversations must be listed here to resolve. room:<id> requires a
  # room-capable adapter plus this default room channel, or it is rejected.
  home_channels: []
  bot_profiles: []
  local_conversations: []
  default_room_channel: null
