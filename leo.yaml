paths:
  # Whitelist root for outbound attachments (channel_send / message send media).
  # Config-owned on purpose: it is read once at startup and given to the Gateway
  # at construction, so no tool-call argument can widen it. Relative paths are
  # resolved against the config root. Files outside this tree are refused.
  outbound_media: .leo/media/outbound

security:
  # Smart shell policy. smart auto-runs read-only/test commands, asks
  # for risky or unknown ones, and always denies the hardline blocklist.
  # manual asks for every command; off runs everything except hardline.
  shell_enabled: true
  shell_mode: smart
  # Glob patterns that always deny, before approvals are consulted. Example:
  # deny_commands:
  #   - "git push --force*"
  deny_commands: []
  allowed_roots:
    # `~` is expanded per operator (see Settings.resolve), so this file stays
    # portable; add absolute roots only in a local, uncommitted override.
    - ~/Downloads
